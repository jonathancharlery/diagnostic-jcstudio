<style>
:root {
  --vert:   #07404A;
  --terra:  #A35C33;
  --orange: #DB7500;
  --sable:  #DDD7C9;
  --beige:  #E6DCC6;
  --gris:   #BBC2C7;
  --brun:   #B8A181;
  --creme:  #F7F4EF;
  --noir:   #1A1A1A;
  --blanc:  #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, sans-serif; background: var(--beige); color: var(--noir); padding-bottom: 100px; }

/* HEADER */
.app-header { background: var(--vert); padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
.app-header img { width: 80px; height: 80px; object-fit: contain; flex-shrink: 0; }
.app-header h1 { color: #fff; font-size: 17px; font-weight: 700; }
.app-header p { color: var(--sable); font-size: 11px; margin-top: 2px; }

/* PROGRESS */
.progress-bar { height: 4px; background: rgba(255,255,255,0.15); position: sticky; top: 100px; z-index: 99; }
.progress-fill { height: 100%; background: var(--orange); transition: width 0.4s; width: 0%; }

/* CONTENT */
.content { max-width: 800px; margin: 0 auto; padding: 16px 12px; }

/* CARDS */
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(7,64,74,0.10); overflow: hidden; margin-bottom: 18px; }
.card-header { background: var(--vert); padding: 12px 16px; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

/* DOSSIER FIELDS */
.dossier-fields { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dossier-fields .full { grid-column: 1 / -1; }
.field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
.field-group input, .field-group textarea {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--gris); border-radius: 8px;
  font-size: 15px; color: var(--noir); background: var(--creme); outline: none;
  -webkit-appearance: none; font-family: inherit;
}
.field-group input:focus, .field-group textarea:focus { border-color: var(--vert); background: #fff; }
.field-group textarea { resize: none; height: 68px; line-height: 1.4; }

/* DATE STYLED */
.date-styled {
  width: 100%; padding: 11px 13px; border: 2px solid var(--terra); border-radius: 8px;
  font-size: 17px; font-weight: 700; color: var(--vert); background: var(--creme);
  outline: none; -webkit-appearance: none; font-family: inherit;
  text-align: center; letter-spacing: 2px;
}
.date-styled:focus { background: #fff; border-color: var(--vert); }

/* SECTION */
.sec-header { background: var(--beige); padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--sable); }
.sec-num { width: 30px; height: 30px; background: var(--terra); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
.sec-title { font-size: 13px; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: 0.3px; }

/* TABLE HEADER */
.tbl-hdr { background: var(--vert); display: grid; grid-template-columns: 1fr 58px 58px 58px 68px; padding: 9px 16px; gap: 2px; }
.tbl-hdr span { color: #fff; font-size: 10px; font-weight: 700; text-align: center; text-transform: uppercase; }
.tbl-hdr span:first-child { text-align: left; }

/* ROW NORMALE */
.tbl-row { display: grid; grid-template-columns: 1fr 58px 58px 58px 68px; padding: 0 16px; min-height: 50px; align-items: center; gap: 2px; border-bottom: 1px solid rgba(187,194,199,0.3); }
.tbl-row:nth-child(odd) { background: var(--creme); }
.row-lbl { font-size: 13px; color: var(--noir); padding: 12px 0; line-height: 1.4; }

/* ROW SIMPLE (section 17) */
.tbl-row-simple { display: flex; align-items: center; gap: 14px; padding: 0 16px; min-height: 52px; border-bottom: 1px solid rgba(187,194,199,0.3); }
.tbl-row-simple:nth-child(odd) { background: var(--creme); }

/* CHECKBOX */
.cb-cell { display: flex; align-items: center; justify-content: center; }
.cb { position: relative; width: 34px; height: 34px; }
.cb input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; z-index: 2; }
.cb-box { width: 34px; height: 34px; border: 2px solid var(--gris); border-radius: 7px; background: #fff; display: flex; align-items: center; justify-content: center; transition: all 0.15s; pointer-events: none; }
.cb.bon   input:checked + .cb-box { background: #2E8B57; border-color: #2E8B57; }
.cb.moyen input:checked + .cb-box { background: #E8A020; border-color: #E8A020; }
.cb.vetuste  input:checked + .cb-box { background: var(--terra); border-color: var(--terra); }
.cb.insalubre input:checked + .cb-box { background: #C0392B; border-color: #C0392B; }
.cb.simple input:checked + .cb-box { background: var(--terra); border-color: var(--terra); }
.cb-box svg { display: none; }
.cb input:checked + .cb-box svg { display: block; }

/* OBSERVATION */
.obs { padding: 10px 16px 14px; border-top: 1px solid var(--sable); }
.obs label { display: block; font-size: 11px; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 7px; }
.obs textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--gris); border-radius: 8px; font-size: 14px; color: var(--noir); background: var(--creme); resize: none; height: 76px; line-height: 1.5; outline: none; -webkit-appearance: none; font-family: inherit; }
.obs textarea:focus { border-color: var(--vert); background: #fff; }

/* SYNTHESE */
.niveaux { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.niv { border: 2px solid transparent; border-radius: 10px; padding: 12px 8px; text-align: center; font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1.3; -webkit-appearance: none; background: none; width: 100%; }
.niv.leger   { background: #D4EAC8; color: #1a5c2e; border-color: #9ccf8a; }
.niv.partiel { background: #F5D58A; color: #7a4f00; border-color: #e0b040; }
.niv.lourd   { background: #F0A060; color: #fff;    border-color: #d07030; }
.niv.insalub { background: #C0392B; color: #fff;    border-color: #922b21; }
.niv.sel { transform: scale(1.04); box-shadow: 0 4px 14px rgba(0,0,0,0.22); }
.synth-fields { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.synth-fields label { display: block; font-size: 11px; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.synth-fields textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--gris); border-radius: 8px; font-size: 14px; color: var(--noir); background: var(--creme); resize: none; height: 96px; line-height: 1.5; outline: none; -webkit-appearance: none; font-family: inherit; }
.synth-fields textarea:focus { border-color: var(--vert); background: #fff; }

/* REDACTEUR */
.redact { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.redact-info h3 { font-size: 12px; color: var(--vert); font-weight: 700; margin-bottom: 2px; }
.redact-info p { font-size: 15px; font-weight: 800; color: var(--noir); }
.redact-info span { font-size: 12px; color: var(--brun); display: block; margin-top: 1px; }
.date-group label { display: block; font-size: 11px; font-weight: 700; color: var(--vert); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; text-align: center; }

/* BTN GENERER */
.gen-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 16px; background: #fff; border-top: 1px solid var(--sable); box-shadow: 0 -4px 16px rgba(7,64,74,0.12); z-index: 200; }
.btn-gen { width: 100%; background: var(--vert); color: #fff; border: none; border-radius: 14px; padding: 17px; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; -webkit-appearance: none; }
.btn-gen:active { background: #052e35; }

/* TOAST */
.toast { position: fixed; top: 110px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--vert); color: #fff; padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 300; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.2); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 420px) {
  .tbl-hdr { grid-template-columns: 1fr 48px 48px 48px 56px; padding: 9px 10px; }
  .tbl-row { grid-template-columns: 1fr 48px 48px 48px 56px; padding: 0 10px; }
  .niveaux { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

// ── Formatage date auto ───────────────────────────────────────────────
function initDateField(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', function() {
    var v = this.value.replace(/[^0-9]/g, '');
    var r = '';
    if (v.length > 0) r += v.substring(0, Math.min(2, v.length));
    if (v.length > 2) r += '/' + v.substring(2, Math.min(4, v.length));
    if (v.length > 4) r += '/' + v.substring(4, Math.min(8, v.length));
    this.value = r;
    updateProg();
  });
}
initDateField('f_date_visite');
initDateField('f_date_diag');

// ── Construction sections ─────────────────────────────────────────────
function buildSecs() {
  var container = document.getElementById('secs');
  for (var si = 0; si < SECS.length; si++) {
    var num = SECS[si][0];
    var title = SECS[si][1];
    var rows = SECS[si][2];
    var isSimple = (num === 17);

    var card = document.createElement('div');
    card.className = 'card';

    // Header section
    var hdr = document.createElement('div');
    hdr.className = 'sec-header';
    hdr.innerHTML = '<div class="sec-num">' + num + '</div><div class="sec-title">' + title + '</div>';
    card.appendChild(hdr);

    // Table header (sauf section 17)
    if (!isSimple) {
      var th = document.createElement('div');
      th.className = 'tbl-hdr';
      th.innerHTML = '<span>Element</span><span>BON</span><span>MOYEN</span><span>VETUSTE</span><span>INSALUBRE</span>';
      card.appendChild(th);
    }

    // Rows
    for (var ri = 0; ri < rows.length; ri++) {
      var row = document.createElement('div');

      if (isSimple) {
        row.className = 'tbl-row-simple';
        // Checkbox simple
        var cbDiv = document.createElement('div');
        cbDiv.className = 'cb simple';
        var cbInp = document.createElement('input');
        cbInp.type = 'checkbox';
        cbInp.id = 'cb_s' + num + '_r' + ri + '_c0';
        cbInp.addEventListener('change', updateProg);
        var cbBox = document.createElement('div');
        cbBox.className = 'cb-box';
        cbBox.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14"><polyline points="2,7 7,12 16,2" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        cbDiv.appendChild(cbInp);
        cbDiv.appendChild(cbBox);
        var lbl = document.createElement('div');
        lbl.className = 'row-lbl';
        lbl.textContent = rows[ri];
        row.appendChild(cbDiv);
        row.appendChild(lbl);
      } else {
        row.className = 'tbl-row';
        var lbl2 = document.createElement('div');
        lbl2.className = 'row-lbl';
        lbl2.textContent = rows[ri];
        row.appendChild(lbl2);
        var colClasses = ['bon','moyen','vetuste','insalubre'];
        for (var ci = 0; ci < 4; ci++) {
          var cell = document.createElement('div');
          cell.className = 'cb-cell';
          var cbDiv2 = document.createElement('div');
          cbDiv2.className = 'cb ' + colClasses[ci];
          var cbInp2 = document.createElement('input');
          cbInp2.type = 'checkbox';
          cbInp2.id = 'cb_s' + num + '_r' + ri + '_c' + ci;
          cbInp2.addEventListener('change', updateProg);
          var cbBox2 = document.createElement('div');
          cbBox2.className = 'cb-box';
          cbBox2.innerHTML = '<svg width="18" height="14" viewBox="0 0 18 14"><polyline points="2,7 7,12 16,2" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          cbDiv2.appendChild(cbInp2);
          cbDiv2.appendChild(cbBox2);
          cell.appendChild(cbDiv2);
          row.appendChild(cell);
        }
      }
      card.appendChild(row);
    }

    // Observation
    var obs = document.createElement('div');
    obs.className = 'obs';
    var obsLbl = document.createElement('label');
    obsLbl.textContent = 'Observation';
    var obsTa = document.createElement('textarea');
    obsTa.id = 'obs_s' + num;
    obsTa.placeholder = 'Observations complementaires...';
    obsTa.addEventListener('input', updateProg);
    obs.appendChild(obsLbl);
    obs.appendChild(obsTa);
    card.appendChild(obs);

    container.appendChild(card);
  }
}
buildSecs();

// ── Niveau sélection ──────────────────────────────────────────────────
function selNiv(btn, idx) {
  var btns = document.querySelectorAll('.niv');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('sel');
  btn.classList.add('sel');
  niv = idx;
  updateProg();
}

// ── Progress ──────────────────────────────────────────────────────────
function updateProg() {
  var total = 0, filled = 0;
  var ids = ['f_client','f_date_visite','f_adresse','f_operateur','f_ref'];
  for (var i = 0; i < ids.length; i++) {
    total++;
    var el = document.getElementById(ids[i]);
    if (el && el.value.trim()) filled++;
  }
  for (var si = 0; si < SECS.length; si++) {
    var num = SECS[si][0];
    var rows = SECS[si][2];
    var isSimple = (num === 17);
    for (var ri = 0; ri < rows.length; ri++) {
      total++;
      if (isSimple) {
        var cb = document.getElementById('cb_s' + num + '_r' + ri + '_c0');
        if (cb && cb.checked) filled++;
      } else {
        for (var ci = 0; ci < 4; ci++) {
          var cb2 = document.getElementById('cb_s' + num + '_r' + ri + '_c' + ci);
          if (cb2 && cb2.checked) { filled++; break; }
        }
      }
    }
  }
  total++; if (niv >= 0) filled++;
  document.getElementById('prog').style.width = Math.round(filled/total*100) + '%';
}

// ── Collecte ──────────────────────────────────────────────────────────
function collectData() {
  var data = {
    client:      document.getElementById('f_client').value.trim(),
    date_visite: document.getElementById('f_date_visite').value.trim(),
    adresse:     document.getElementById('f_adresse').value.trim(),
    operateur:   document.getElementById('f_operateur').value.trim(),
    ref:         document.getElementById('f_ref').value.trim(),
    synthese:    document.getElementById('f_synthese').value.trim(),
    travaux:     document.getElementById('f_travaux').value.trim(),
    niveau:      niv,
    date_diag:   document.getElementById('f_date_diag').value.trim(),
    sections:    []
  };
  for (var si = 0; si < SECS.length; si++) {
    var num = SECS[si][0];
    var title = SECS[si][1];
    var rows = SECS[si][2];
    var isSimple = (num === 17);
    var secData = { num: num, title: title, rows: [], obs: '' };
    var obsEl = document.getElementById('obs_s' + num);
    if (obsEl) secData.obs = obsEl.value.trim();
    for (var ri = 0; ri < rows.length; ri++) {
      var evals = [false, false, false, false];
      if (isSimple) {
        var cb = document.getElementById('cb_s' + num + '_r' + ri + '_c0');
        evals[0] = cb ? cb.checked : false;
      } else {
        for (var ci = 0; ci < 4; ci++) {
          var cb2 = document.getElementById('cb_s' + num + '_r' + ri + '_c' + ci);
          evals[ci] = cb2 ? cb2.checked : false;
        }
      }
      secData.rows.push({ label: rows[ri], evals: evals });
    }
    data.sections.push(secData);
  }
  return data;
}

// ── Toast ─────────────────────────────────────────────────────────────
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

    function drawCheck(cx, cy, sz) {
      var s = sz * 0.38;
      doc.setLineWidth(0.85);
      doc.line(cx-s*0.9, cy, cx-s*0.1, cy+s*1.1);
      doc.line(cx-s*0.1, cy+s*1.1, cx+s*1.1, cy-s*1.0);

    function drawFtr(pnum, total) {
      ss(C_VERT); doc.setLineWidth(0.5);
      doc.line(ML,H-14,W-MR,H-14);

      st(C_TERRA); doc.setFont('helvetica','bold'); doc.setFontSize(8);
      doc.text(pnum+' / '+total,W-MR,H-9,{align:'right'});
    }

    function drawSecTitle(y, num, title) {
      sf(C_BEIGE); doc.roundedRect(ML,y,CW,11,2,2,'F');
      sf(C_TERRA); doc.circle(ML+7,y+5.5,4.5,'F');
      st(C_BLANC); doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text(String(num),ML+7,y+7,{align:'center'});
      st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(10);

      return y+11;
    }

    function drawTblHdr(y) {
      sf(C_VERT); doc.rect(ML,y,CW,7,'F');
      st(C_BLANC); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      var cx = [126,147,167,188];
      var lbl = ['BON','MOYEN','VETUSTE','INSALUBRE'];
      for (var i=0;i<4;i++) doc.text(lbl[i],cx[i],y+5,{align:'center'});
      return y+7;
    }

    function drawRow(y, label, evals, ri, simple) {
      var RH = 9;
      sf(ri%2===0 ? C_SABLE : C_BLANC); doc.rect(ML,y,CW,RH,'F');
      ss(C_GRIS); doc.setLineWidth(0.2); doc.line(ML,y+RH,W-MR,y+RH);
      st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      var lines = doc.splitTextToSize(label, simple ? 165 : 108);
      var ty = y+RH/2+(lines.length>1?-2.5:0.5);
      for(var li=0;li<lines.length;li++) doc.text(lines[li],ML+4,ty+li*4);
      var colX=[126,147,167,188];
      var cbColors=[[46,139,87],[232,160,32],[163,92,51],[192,57,43]];
      if(simple) {
        var cx=190, cy2=y+RH/2;
        if(evals[0]) {
          sf(C_TERRA); doc.roundedRect(cx-4,cy2-4,8,8,1,1,'F');
          ss(C_BLANC); drawCheck(cx-0.5,cy2-1.5,4);
        } else {
          sf(C_BLANC); ss(C_GRIS); doc.setLineWidth(0.4);
          doc.roundedRect(cx-4,cy2-4,8,8,1,1,'FD');
        }
      } else {
        for(var ci=0;ci<4;ci++) {
          var cx2=colX[ci], cy3=y+RH/2;
          if(evals[ci]) {
            sf(cbColors[ci]); doc.roundedRect(cx2-3.5,cy3-3.5,7,7,1,1,'F');
            ss(C_BLANC); drawCheck(cx2-0.5,cy3-1.5,3.5);
          } else {
            sf(C_BLANC); ss(C_GRIS); doc.setLineWidth(0.4);
            doc.roundedRect(cx2-3.5,cy3-3.5,7,7,1,1,'FD');
          }
        }
      }
      return y+RH;
    }

    function drawObs(y, text) {
      st(C_VERT); doc.setFont('helvetica','bolditalic'); doc.setFontSize(8);
      doc.text('Observation :',ML,y+5);
      var OH=16; sf(C_CREME); ss(C_BRUN); doc.setLineWidth(0.4);
      doc.roundedRect(ML,y+7,CW,OH,1.5,1.5,'FD');
      if(text) {
        st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        var ls=doc.splitTextToSize(text,CW-6);
        for(var i=0;i<Math.min(ls.length,3);i++) doc.text(ls[i],ML+3,y+13+i*4.5);
      }
      return y+7+OH+4;
    }

    // Pagination
    var YS=33, YE=H-18, AVAIL=YE-YS;
    function sH(rows) { return 11+7+rows.length*9+28; }
    var pages=[], cur=[], used=0;
    for(var si=0;si<data.sections.length;si++) {
      var sh=sH(data.sections[si].rows);
      if(cur.length && used+sh>AVAIL) { pages.push(cur); cur=[data.sections[si]]; used=sh; }
      else { cur.push(data.sections[si]); used+=sh; }
    }
    if(cur.length) pages.push(cur);
    var TOTAL = 1 + pages.length + 1;

    // ── PAGE DE GARDE ───────────────────────────────────────────────
    sf(C_BEIGE); doc.rect(0,0,W,H,'F');

    st(C_BLANC); doc.setFont('helvetica','bold'); doc.setFontSize(20);
    doc.text('JC STUDIO',46,18);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text("Maitrise d'oeuvre",46,25);
    doc.setFont('helvetica','italic'); doc.setFontSize(8);
    st(C_SABLE); doc.text("La ou la vision prend forme.",46,32);
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(26);
    doc.text('Diagnostic',15,75); doc.text('Technique de',15,91);
    st(C_TERRA); doc.text('Maison',15,107);
    st(C_VERT); doc.text('Individuelle',15,123);
    st(C_BRUN); doc.setFont('helvetica','italic'); doc.setFontSize(11);
    doc.text("Analyse Technique de l'Existant",15,133);
    ss(C_TERRA); doc.setLineWidth(2.5); doc.line(15,138,85,138);
    sf(C_BLANC); doc.roundedRect(12,147,W-24,100,2,2,'F');
    ss(C_GRIS); doc.setLineWidth(0.4); doc.roundedRect(12,147,W-24,100,2,2,'D');
    sf(C_VERT); doc.rect(12,147,W-24,14,'F');
    st(C_BLANC); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('INFORMATIONS DU DOSSIER',17,156);
    var flds=[['Client',data.client],['Date de visite',data.date_visite],['Adresse du bien',data.adresse],['Operateur social',data.operateur],['Ref. dossier',data.ref]];
    var fy=170;
    var pairs=[[0,1],[2,null],[3,4]];
    for(var pi=0;pi<pairs.length;pi++) {
      var pair=pairs[pi];
      st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      if(pair[1]!==null) {
        doc.text(flds[pair[0]][0]+' :',17,fy);
        doc.text(flds[pair[1]][0]+' :',W/2+2,fy);
        sf(C_CREME); ss(C_TERRA); doc.setLineWidth(0.4);
        doc.roundedRect(17,fy+1,W/2-20,7,1,1,'FD');
        doc.roundedRect(W/2+2,fy+1,W/2-17,7,1,1,'FD');
        st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text(flds[pair[0]][1],19,fy+6);
        doc.text(flds[pair[1]][1],W/2+4,fy+6);
        fy+=14;
      } else {
        doc.text(flds[pair[0]][0]+' :',17,fy);
        sf(C_CREME); ss(C_TERRA); doc.setLineWidth(0.4);
        doc.roundedRect(17,fy+1,W-34,10,1,1,'FD');
        st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text(flds[pair[0]][1],19,fy+7);
        fy+=18;
      }
    }
    sf(C_VERT); doc.rect(0,H-22,W,22,'F');
    st(C_BLANC); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text("JC Studio SASU  -  Maitrise d'oeuvre",12,H-12);
    st(C_ORANGE); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text('1 / '+TOTAL,W-12,H-9,{align:'right'});

    // ── PAGES SECTIONS ──────────────────────────────────────────────
    for(var pi2=0;pi2<pages.length;pi2++) {
      doc.addPage();
      var pnum=pi2+2;
      drawHdr(pnum); drawFtr(pnum,TOTAL);
      var y=YS+3;
      var psecs=pages[pi2];
      for(var si2=0;si2<psecs.length;si2++) {
        var sec=psecs[si2];
        y+=3;
        y=drawSecTitle(y,sec.num,sec.title);
        if(sec.num!==17) y=drawTblHdr(y);
        for(var ri2=0;ri2<sec.rows.length;ri2++) {
          y=drawRow(y,sec.rows[ri2].label,sec.rows[ri2].evals,ri2,sec.num===17);
        }
        y=drawObs(y,sec.obs);
      }
    }

    // ── PAGE SYNTHESE ───────────────────────────────────────────────
    doc.addPage();
    var lnum=pages.length+2;
    drawHdr(lnum); drawFtr(lnum,TOTAL);
    var y2=YS+3;
    sf(C_VERT); doc.rect(ML,y2,CW,12,'F');

    doc.text('SYNTHESE GENERALE DU DIAGNOSTIC',ML+5,y2+8.5);
    y2+=16;

    var NCOLORS=[[212,234,200],[245,213,138],[240,160,96],[192,57,43]];
    var NTXT=[[30,100,50],[120,80,0],[255,255,255],[255,255,255]];
    var nw2=CW/4;
    for(var ni=0;ni<4;ni++) {
      var bx2=ML+ni*nw2;
      sf(NCOLORS[ni]); doc.roundedRect(bx2+1,y2,nw2-2,22,1.5,1.5,'F');
      if(data.niveau===ni) {
        ss(C_VERT); doc.setLineWidth(1.5); doc.roundedRect(bx2+1,y2,nw2-2,22,1.5,1.5,'D');
        sf(C_VERT); doc.circle(bx2+nw2-5,y2+4,2.5,'F');
        ss(C_BLANC); drawCheck(bx2+nw2-5.5,y2+2.5,2.5);
      }
      st(NTXT[ni]); doc.setFont('helvetica','bold'); doc.setFontSize(6.5);
      var ws2=NLBLS[ni].split(' ');
      var l1=ws2.slice(0,2).join(' '), l2=ws2.slice(2).join(' ');
      doc.text(l1,bx2+nw2/2,y2+10,{align:'center'});
      if(l2) doc.text(l2,bx2+nw2/2,y2+15,{align:'center'});
    }
    y2+=27;
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Synthese des desordres constates :',ML,y2+4);
    y2+=7; sf(C_CREME); ss(C_BRUN); doc.setLineWidth(0.4);
    doc.roundedRect(ML,y2,CW,35,1.5,1.5,'FD');
    if(data.synthese) {
      st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      var ls2=doc.splitTextToSize(data.synthese,CW-6);
      for(var i2=0;i2<Math.min(ls2.length,6);i2++) doc.text(ls2[i2],ML+3,y2+6+i2*5);
    }
    y2+=40;
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('Travaux preconises (nature et priorite) :',ML,y2+4);
    y2+=7; sf(C_CREME); ss(C_BRUN); doc.setLineWidth(0.4);
    doc.roundedRect(ML,y2,CW,35,1.5,1.5,'FD');
    if(data.travaux) {
      st(C_NOIR); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      var lt=doc.splitTextToSize(data.travaux,CW-6);
      for(var i3=0;i3<Math.min(lt.length,6);i3++) doc.text(lt[i3],ML+3,y2+6+i3*5);
    }
    y2+=40;
    sf(C_CREME); ss(C_BRUN); doc.setLineWidth(0.4);
    doc.roundedRect(ML,y2,CW,18,1.5,1.5,'FD');
    ss(C_GRIS); doc.setLineWidth(0.3);
    doc.line(ML+CW/2,y2+2,ML+CW/2,y2+16);
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text('Redacteur du diagnostic',ML+4,y2+5.5);
    st(C_NOIR); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Jonathan Charlery',ML+4,y2+11);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text("Maitre d'oeuvre - JC Studio SASU",ML+4,y2+16);
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text('Date du diagnostic :',ML+CW/2+4,y2+5.5);
    st(C_VERT); doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(data.date_diag || '',ML+CW/2+4,y2+14);

    // ── TÉLÉCHARGEMENT iOS compatible ───────────────────────────────
    var client2 = data.client ? data.client.replace(/[^a-zA-Z0-9]/g,'_') : 'client';
    var dated = data.date_diag ? data.date_diag.replace(/\//g,'-') : 'sans-date';
    var fname = 'Diagnostic_JCStudio_' + client2 + '_' + dated + '.pdf';

    // iOS Safari : ouvrir dans nouvel onglet
    var pdfBlob = doc.output('blob');
    var url = URL.createObjectURL(pdfBlob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fname;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);

    showToast('PDF genere ! Enregistrez-le depuis l apercu.');

  } catch(err) {
    console.error(err);
    showToast('Erreur : ' + err.message);
  } finally {
    btn.innerHTML = '<span>📄</span> Generer le PDF';
    btn.disabled = false;
  }
}
